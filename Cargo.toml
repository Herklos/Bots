[workspace]
resolver = "2"
members = ["gateway", "design"]
exclude = ["exact/vendor/ibex/crates/hermes-lean-sys-installer"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.2.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "deny", priority = -1 }
missing_debug_implementations = "warn"
# `pub` in a private module of the gateway binary is not visible to another crate.
# Keep `pub` for the design crate's API. `gateway/src/computer.rs` is allowed at its module.
unreachable_pub = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"
cast_lossless = "warn"
# macOS volumes are case-insensitive, so ".JSON" is the same file as ".json".
case_sensitive_file_extension_comparisons = "warn"
unused_async = "warn"
map_err_ignore = "warn"
multiple_crate_versions = "warn"
allow_attributes_without_reason = "warn"
