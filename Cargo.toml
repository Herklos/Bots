[workspace]
resolver = "2"
members = ["gateway", "design"]
exclude = ["exact/vendor/ibex/crates/hermes-lean-sys-installer"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"
cast_lossless = "warn"
