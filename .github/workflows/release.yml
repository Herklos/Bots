name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        name: Tag matches Cargo.toml
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME doesn't match Cargo.toml $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  web:
    # The Exact web app, built once and packed into every target's archive.
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: expo/exact
          # Set the repository variable EXACT_REF to a reviewed commit or tag; main is used until it is set.
          ref: ${{ vars.EXACT_REF || 'main' }}
          path: exact
      - uses: oven-sh/setup-bun@v2
      - name: Set up Exact (toolchains and tools; the first run takes a few minutes)
        run: cd exact && bun scripts/exact.mjs setup
      - name: Build the web app
        run: EXACT_APP_DIR="$PWD/app" bun exact/host/web/build.mjs bots-web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: app/target/web-dist
          if-no-files-found: error

  build:
    needs: [verify, web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            # A native arm64 runner, so no cross toolchain is needed. Public repositories have it;
            # a private repository needs an arm64 runner enabled.
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            # Built on the arm64 macOS runner with the x86_64 Rust target.
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --locked --release -p bots-gateway --target ${{ matrix.target }}
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web-dist
      - name: Pack the release archive
        run: |
          sh scripts/pack-release.sh \
            --bin "target/${{ matrix.target }}/release/bots" \
            --web web-dist \
            --target "${{ matrix.target }}" \
            --version "${{ needs.verify.outputs.version }}" \
            --out release
      - uses: actions/upload-artifact@v4
        with:
          name: bots-${{ matrix.target }}
          path: release/
          if-no-files-found: error

  publish:
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: bots-*
          path: parts
      - name: Collect the archives and one SHA256SUMS
        run: |
          mkdir -p release
          for d in parts/*/; do cp "$d"bots-*.tar.gz release/; cat "$d"SHA256SUMS >> release/SHA256SUMS; done
          sort -k2 -o release/SHA256SUMS release/SHA256SUMS
          cat release/SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" release/*.tar.gz release/SHA256SUMS \
            --title "Bots ${GITHUB_REF_NAME#v}" --generate-notes $prerelease
