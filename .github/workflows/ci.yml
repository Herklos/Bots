name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: fmt, clippy, test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: rust file length
        run: sh scripts/check-rs-length.sh
      - name: T3 RPC boundary
        run: sh scripts/check-t3-boundary.sh
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: cargo test
        run: cargo test --locked

  contract:
    name: contract check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: expo/exact
          # Same pin as the release workflow.
          ref: ${{ vars.EXACT_REF || 'main' }}
          path: exact
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install app packages
        run: bun install --frozen-lockfile --cwd app
      - name: Check the contract
        run: EXACT_DIR="$PWD/exact" bun scripts/check-contract.mjs
      - name: Check app file sizes
        run: bun scripts/check-size.mjs
